<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мировая Контурная Карта Pro Max</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #f8fafc; --panel-bg: #ffffff; --accent: #1e293b;
            --correct: #86efac; --incorrect: #fca5a5; --target-hint: #60a5fa; --text: #0f172a;
        }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text); overflow: hidden; }
        .app-layout { display: flex; flex-direction: column; height: 100vh; }
        #map { height: 90%; width: 100%; background: #cbd5e1; }
        #bottom-panel {
            height: 10%; background: var(--panel-bg); border-top: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px env(safe-area-inset-bottom) 15px; box-sizing: border-box; z-index: 1000;
        }
        #question-box { display: flex; flex-direction: column; flex: 1; }
        #task-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 2px; }
        #target-name { font-size: 16px; font-weight: 700; color: var(--accent); line-height: 1.1; }
        .right-controls { display: flex; flex-direction: column; align-items: flex-end; }
        #score-box { font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        .btn-small { background: #e2e8f0; color: var(--accent); border: none; padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; text-transform: uppercase; }
        .clickable-country { cursor: pointer; outline: none; }
        .clickable-country:hover { fill-opacity: 0.7 !important; transition: 0.2s; }
        #info-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); padding: 12px 24px;
            border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 2000;
            display: none; text-align: center; border: 1px solid #e2e8f0; pointer-events: none; width: 85%; max-width: 350px;
        }
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--accent); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 3000; transition: opacity 0.4s; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .menu-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; margin: auto; }
        .section-title { font-size: 12px; text-transform: uppercase; opacity: 0.6; margin: 15px 0 10px 0; letter-spacing: 1px; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn-menu { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-menu.active { background: white; color: var(--accent); }
        .btn-start { width: 100%; padding: 16px; border-radius: 15px; border: none; background: #60a5fa; color: white; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="start-overlay">
    <div class="menu-card">
        <h1 style="margin: 0 0 10px 0; font-size: 26px; text-align: center;">Карта Мира (195 стран)</h1>
        <div id="loading-text" style="text-align: center;">Загрузка данных...</div>
        <div id="ui-content" class="hidden">
            <button id="resume-btn" class="btn-start hidden" style="background:#34d399; margin-bottom:10px;" onclick="resumeGame()">Продолжить игру</button>
            <div class="section-title">Режим</div>
            <div class="grid-menu" id="mode-selector">
                <button class="btn-menu active" onclick="setMode('name', this)">Названия</button>
                <button class="btn-menu" onclick="setMode('cap', this)">Столицы</button>
                <button class="btn-menu" onclick="setMode('flag', this)" style="grid-column: span 2;">Флаги</button>
            </div>
            <div class="section-title">Регион</div>
            <div class="grid-menu" id="region-selector">
                <button class="btn-menu active" onclick="setReg('Europe', this)">Европа (44)</button>
                <button class="btn-menu" onclick="setReg('Asia', this)">Азия (48)</button>
                <button class="btn-menu" onclick="setReg('Africa', this)">Африка (54)</button>
                <button class="btn-menu" onclick="setReg('North America', this)">Сев.Америка (23)</button>
                <button class="btn-menu" onclick="setReg('South America', this)">Юж.Америка (12)</button>
                <button class="btn-menu" onclick="setReg('Oceania', this)">Океания (14)</button>
                <button class="btn-menu" onclick="setReg('World', this)" style="grid-column: span 2; background: rgba(255,255,255,0.15);">Все страны мира (195) 🌍</button>
            </div>
            <button class="btn-start" onclick="initNewGame()">Начать заново</button>
        </div>
    </div>
</div>

<div class="app-layout">
    <div id="map"></div>
    <div id="bottom-panel" onclick="skipDelay()">
        <div id="question-box">
            <span id="task-label">Найдите на карте:</span>
            <span id="target-name">Загрузка...</span>
        </div>
        <div class="right-controls">
            <div id="score-box"><span id="current-score">0</span> / <span id="total-count">0</span></div>
            <button class="btn-small" onclick="location.reload()">Меню</button>
        </div>
    </div>
</div>

<div id="info-overlay"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
