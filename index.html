<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMaster Pro | 195 стран</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="GEO.png">
    <link rel="apple-touch-icon" href="GEO.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GeoMaster">
    <meta name="theme-color" content="#0f172a">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #f8fafc; --panel-bg: #ffffff; --accent: #0f172a;
            --correct: #34d399; --incorrect: #f87171; --target-hint: #60a5fa;
            --text: #1e293b; --muted: #64748b;
        }
        
        * { box-sizing: border-box; touch-action: manipulation; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text); overflow: hidden; }
        
        .app-layout { display: flex; flex-direction: column; height: 100vh; }
        #map { height: 90%; width: 100%; background: #e2e8f0; z-index: 1; }
        
        #bottom-panel {
            height: 10%; background: var(--panel-bg); border-top: 1px solid #cbd5e1;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px env(safe-area-inset-bottom) 15px; z-index: 1000;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
        }
        
        #question-box { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        #task-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 2px; }
        #target-name { font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .right-controls { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; min-width: 80px; }
        #score-box { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
        .btn-small { background: #f1f5f9; color: var(--accent); border: 1px solid #e2e8f0; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
        .btn-small:active { background: #e2e8f0; }
        
        .clickable-country { cursor: pointer; outline: none; transition: fill-opacity 0.2s; }
        .clickable-country:hover { fill-opacity: 0.7 !important; }
        
        #info-overlay {
            position: absolute; top: max(20px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); padding: 14px 24px;
            border-radius: 100px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 2000;
            display: none; text-align: center; border: 1px solid rgba(0,0,0,0.05); pointer-events: none; width: 90%; max-width: 360px;
        }
        
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--accent); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 3000; transition: opacity 0.3s ease; overflow-y: auto; padding: 20px;
        }
        
        .menu-card { background: rgba(255,255,255,0.03); padding: 24px; border-radius: 24px; width: 100%; max-width: 420px; margin: auto; border: 1px solid rgba(255,255,255,0.05); }
        .section-title { font-size: 11px; text-transform: uppercase; color: #94a3b8; margin: 20px 0 10px 0; letter-spacing: 1px; font-weight: 600; }
        
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-menu { background: rgba(255,255,255,0.05); color: #cbd5e1; border: 2px solid transparent; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-menu.active { background: rgba(255,255,255,0.1); color: white; border-color: #3b82f6; }
        
        .btn-start { width: 100%; padding: 18px; border-radius: 16px; border: none; background: #3b82f6; color: white; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 25px; transition: background 0.2s; }
        .btn-start:active { background: #2563eb; }
        .btn-resume { background: #10b981; margin-top: 0; margin-bottom: 5px; }
        
        .hidden { display: none !important; }
        .error-msg { color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; text-align: center; }
    </style>
</head>

<div id="start-overlay">

                <button class="btn-menu" onclick="app.setReg('Oceania', this)">Океания (14)</button>
                <button class="btn-menu" onclick="app.setReg('World', this)" style="grid-column: span 2; background: rgba(59, 130, 246, 0.2); border-color: transparent; color: white;">Все страны мира (195) 🌍</button>
            </div>
            <button class="btn-start" onclick="app.initNewGame()">Начать новую игру</button>
        </div>
    </div>
</div>

<div class="app-layout">
